<!DOCTYPE html>
<html>
<head>
    <title>JOLOPOGI123</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 90%;
            max-width: 540px;
            margin: 70px auto;
        }

        /* LYRICS BOX */
        #display {
            width: 100%;
            height: 110px;

            background: pink;

            /* KULAY NG LYRICS */
            color: black;

            border: 2px solid #777;
            border-radius: 15px;

            display: flex;
            align-items: center;

            /* LYRICS SA KANAN */
            justify-content: flex-end;

            padding-right: 25px;

            font-size: 24px;
            font-weight: normal;

            text-align: right;

            overflow: hidden;
            white-space: nowrap;
        }

        /* BUTTONS */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 25px;
        }

        button {
            height: 90px;
            border: none;
            border-radius: 15px;

            background: #eee;
            color: pink;

            font-size: 28px;
        }

        button:active {
            transform: scale(0.95);
        }

        /* EQUALS BUTTON */
        .equals {
            background: #ff9d00;
            color: pink;
        }

        /* TITLE */
        .title {
            color: pink;
            text-align: center;

            font-size: 28px;

            margin-top: 70px;
        }

        /* PHONE SIZE */
        @media (max-width: 400px) {

            .calculator {
                width: 92%;
                margin-top: 40px;
            }

            button {
                height: 70px;
                font-size: 22px;
            }

            #display {
                height: 100px;
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <!-- LYRICS DISPLAY -->
    <div id="display"></div>


    <!-- CALCULATOR BUTTONS -->
    <div class="buttons">

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="clearDisplay()">C</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('+')">+</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">-</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('*')">*</button>
        <button onclick="press('/')">/</button>

        <button
            class="equals"
            onclick="startLyrics()">
            =
        </button>

    </div>


    <!-- TITLE -->
    <div class="title">
        jolopogi123
    </div>

</div>


<!-- MUSIC -->

<audio id="music">
    <source src="haha.mp4" type="audio/mpeg">
</audio>


<script>

    /* =========================
       LYRICS
       ========================= */

    let lyrics = [

        ["...", 15000],

    ];


    /* =========================
       VARIABLES
       ========================= */

    let currentLine = 0;

    let displayingLyrics = false;


    /* =========================
       CALCULATOR BUTTON
       ========================= */

    function press(key) {

        if (displayingLyrics) {
            return;
        }

        let display =
            document.getElementById("display");

        display.innerHTML += key;
    }


    /* =========================
       CLEAR BUTTON
       ========================= */

    function clearDisplay() {

        if (displayingLyrics) {
            return;
        }

        document.getElementById("display").innerHTML = "";
    }


    /* =========================
       START LYRICS + MUSIC
       ========================= */

    function startLyrics() {

        if (displayingLyrics) {
            return;
        }

        displayingLyrics = true;

        currentLine = 0;


        /* CLEAR DISPLAY */

        document.getElementById("display").innerHTML = "";


        /* START MUSIC */

        let music =
            document.getElementById("music");

        music.currentTime = 0;

        music.play();


        /* START LYRICS */

        showLyrics();
    }


    /* =========================
       SHOW LYRICS
       ========================= */

    function showLyrics() {

        if (currentLine >= lyrics.length) {

            displayingLyrics = false;

            document.getElementById("display").innerHTML = "";


            /* STOP MUSIC */

            let music =
                document.getElementById("music");

            music.pause();

            music.currentTime = 0;

            return;
        }


        let display =
            document.getElementById("display");


        let line =
            lyrics[currentLine][0];


        let delay =
            lyrics[currentLine][1];


        /* SHOW CURRENT LYRIC */

        display.innerHTML = line;


        currentLine++;


        /* NEXT LYRIC */

        setTimeout(
            showLyrics,
            delay
        );
    }

</script>

</body>
</html>
